<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Tea | Xiangfeng Tea — Premium Chinese Tea Exporter</title>
  <link rel="icon" type="image/png" href="">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0F4C3A;
      --primary-light: #1A6B52;
      --gold: #D4AF37;
      --gold-light: #E8D5A3;
      --bg-warm: #F8F5F0;
      --bg-cream: #FDFBF7;
      --text-dark: #2D2D2D;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-dark);
      background: var(--bg-cream);
      line-height: 1.7;
    }
    .font-serif-heading {
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      font-weight: 600;
    }
    .accent-line { width: 60px; height: 3px; background: var(--gold); margin: 0 auto; }
    .nav-scrolled { background: rgba(255,255,255,0.97); backdrop-filter: blur(12px); }
    .nav-link { position: relative; text-decoration: none; }
    .nav-link::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: var(--gold); transition: width 0.3s ease; }
    .nav-link:hover::after { width: 100%; }
    .product-card {
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.4s ease;
      background: white; border-radius: 20px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .product-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.12); }
    .product-card .img-wrap { overflow: hidden; height: 240px; }
    .product-card .img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
    .product-card:hover .img-wrap img { transform: scale(1.06); }
    .product-detail-card {
      background: white; border-radius: 20px; overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .detail-img-wrap { height: 300px; overflow: hidden; }
    .detail-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
    .detail-img-wrap:hover img { transform: scale(1.04); }
    .tab-btn { padding: 10px 20px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; }
    .tab-btn.active { background: var(--primary); color: white; }
    .tab-btn:not(.active) { background: #f3f4f6; color: #6b7280; }
    .tab-btn:not(.active):hover { background: #e5e7eb; }
    @media (max-width: 768px) {
      .detail-img-wrap { height: 200px; }
    }
  </style>
</head>
<body>
  <!-- NAVIGATION -->
  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 py-4 nav-scrolled">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <img src="https://video.aultras-tea.com/%E6%A0%87%E5%87%86%E7%89%88-%E6%A8%AA%E5%BC%8F.png" alt="Xiangfeng Tea" class="header-logo-img">
      </a>
      <div class="hidden lg:flex items-center gap-6">
        <a href="index.html#about" class="nav-link text-[var(--text-dark)]/80 text-sm font-medium uppercase tracking-wide">About</a>
        <a href="index.html#products" class="nav-link text-[var(--primary)] text-sm font-medium uppercase tracking-wide">Products</a>
        <a href="index.html#news" class="nav-link text-[var(--text-dark)]/80 text-sm font-medium uppercase tracking-wide">News</a>
        <a href="index.html#contact" class="nav-link text-[var(--text-dark)]/80 text-sm font-medium uppercase tracking-wide">Contact</a>
        <div class="flex items-center gap-1 ml-2">
          <button onclick="switchLang('en')" class="px-2.5 py-1 rounded-full border border-gray-300 text-xs text-gray-500 hover:bg-[var(--primary)] hover:text-white hover:border-[var(--primary)] transition-all">EN</button>
          <button onclick="switchLang('zh')" class="px-2.5 py-1 rounded-full border border-gray-300 text-xs text-gray-500 hover:bg-[var(--primary)] hover:text-white hover:border-[var(--primary)] transition-all">中文</button>
          <button onclick="switchLang('ru')" class="px-2.5 py-1 rounded-full border border-gray-300 text-xs text-gray-500 hover:bg-[var(--primary)] hover:text-white hover:border-[var(--primary)] transition-all">RU</button>
          <button onclick="switchLang('de')" class="px-2.5 py-1 rounded-full border border-gray-300 text-xs text-gray-500 hover:bg-[var(--primary)] hover:text-white hover:border-[var(--primary)] transition-all">DE</button>
        </div>
      </div>
      <button id="mobile-toggle" class="lg:hidden text-[var(--primary)] text-2xl" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
    <div id="mobile-menu" class="hidden lg:hidden flex-col bg-white/98 backdrop-blur-md px-6 py-6 gap-4 shadow-lg">
      <a href="index.html#about" class="text-sm font-medium uppercase">About</a>
      <a href="index.html#products" class="text-sm font-medium uppercase">Products</a>
      <a href="index.html#news" class="text-sm font-medium uppercase">News</a>
      <a href="index.html#contact" class="text-sm font-medium uppercase">Contact</a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="pt-28 pb-16 text-center relative overflow-hidden" style="background: linear-gradient(135deg, #4A3728 0%, #2E2016 100%);">
    <div class="absolute inset-0 opacity-10">
      <div class="absolute inset-0" style="background-image: url('data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"60\" height=\"60\" viewBox=\"0 0 60 60\"><path d=\"M30 10 Q35 25 30 40 Q25 25 30 10Z\" fill=\"%23ffffff\" fill-opacity=\"0.15\"/></svg>'); background-size: 120px;"></div>
    </div>
    <div class="max-w-4xl mx-auto px-6 relative z-10">
      <a href="index.html#products" class="inline-flex items-center gap-2 text-white/70 text-sm mb-6 hover:text-white transition-colors">
        <i class="fa-solid fa-arrow-left text-xs"></i> Back to All Products
      </a>
      <p class="text-white/60 text-sm uppercase tracking-[0.25em] mb-3">Premium Chinese Tea</p>
      <h1 class="font-serif-heading text-4xl md:text-6xl lg:text-7xl text-white mb-4" id="cat-name"></h1>
      <div class="accent-line mb-6"></div>
      <p class="text-white/70 text-sm md:text-base max-w-2xl mx-auto leading-relaxed" id="cat-desc"></p>
    </div>
  </section>

  <!-- PRODUCT GRID -->
  <section class="py-20">
    <div class="max-w-7xl mx-auto px-6">
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8" id="products-grid"></div>
      <div id="no-products" class="hidden text-center py-16 text-gray-400">
        <i class="fa-solid fa-leaf text-4xl mb-3 opacity-30"></i>
        <p data-i18n="home.emptyCategory">No products in this category yet. Contact us for custom sourcing.</p>
      </div>
      <div class="text-center mt-16">
        <a href="index.html#contact" class="inline-block px-8 py-3 bg-[var(--primary)] text-white font-semibold rounded-full text-sm uppercase tracking-wider hover:bg-[var(--primary-light)] transition-all duration-300 shadow-md hover:shadow-lg">
          Send Inquiry
        </a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="bg-[#0A2E24] text-white py-12">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <img src="https://video.aultras-tea.com/%E6%A0%87%E5%87%86%E7%89%88-%E6%A8%AA%E5%BC%8F.png" alt="Xiangfeng Tea" style="height:46px;width:auto;max-width:200px;object-fit:contain;filter:brightness(0) invert(1);margin:0 auto 0.5rem;display:block;">
      <p class="text-gray-400 text-sm mb-4">From Mountain to World</p>
      <div class="border-t border-white/10 pt-4 text-gray-500 text-xs">
        <p>&copy; 2026 Xiangfeng Tea. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- FLOATING INQUIRY -->
  <div class="fixed bottom-6 right-6 z-40 flex flex-col gap-2">
    <a id="float-wa" href="tel:+8673184652476" class="w-12 h-12 rounded-full flex items-center justify-center shadow-lg hover:scale-110 transition-transform" style="background:#30b4a8;" title="Phone">
      <i class="fas fa-phone text-white text-xl"></i>
    </a>
    <a id="float-email" href="#" class="w-12 h-12 rounded-full flex items-center justify-center shadow-lg hover:scale-110 transition-transform" style="background:var(--primary);" title="Email">
      <i class="fa-solid fa-envelope text-white text-lg"></i>
    </a>
  </div>

  <script>
    let DATA = null;
    let currentLang = 'en';
    const CATEGORY_ID = 'dark';

    async function loadData() {
      try {
        const resp = await fetch('data.json?t=' + Date.now());
        DATA = await resp.json();
        initPage();
      } catch (err) {
        console.error('Failed to load data:', err);
      }
    }

    function initPage() {
      if (!DATA) return;

      document.getElementById('cat-name').textContent = currentLang === 'zh' ? getCategoryNameCN() : getCategoryName();
      document.getElementById('cat-desc').textContent = currentLang === 'zh' ? getCategoryDescCN() : getCategoryDesc();
      document.title = (currentLang === 'zh' ? getCategoryNameCN() : getCategoryName()) + ' | Xiangfeng Tea';

      if (DATA.inquiry) {
        document.getElementById('float-wa').href = 'tel:+8673184652476';
        document.getElementById('float-email').href = 'mailto:' + DATA.inquiry.email;
      }

      const items = (DATA.products && DATA.products.items) ? DATA.products.items.filter(i => i.category === CATEGORY_ID) : [];
      const grid = document.getElementById('products-grid');

      if (items.length === 0) {
        grid.innerHTML = '';
        document.getElementById('no-products').classList.remove('hidden');
        return;
      }

      document.getElementById('no-products').classList.add('hidden');
      grid.innerHTML = items.map(item => {
        const name = currentLang === 'zh' ? (item.nameCN || item.name) : currentLang === 'ru' ? (item.nameRU || item.name) : currentLang === 'de' ? (item.nameDE || item.name) : item.name;
        const origin = currentLang === 'zh' ? (item.originCN || item.origin) : item.origin;
        const grade = currentLang === 'zh' ? (item.gradeCN || item.grade) : item.grade;
        return `
          <div class="product-card group">
            <div class="img-wrap bg-gray-50 relative">
              <img src="${item.image}" alt="${name}" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center bg-gradient-to-br from-gray-50 to-gray-100\\'><i class=\\'fa-solid fa-leaf text-5xl text-[var(--primary)]/20\\'></i></div>'">
              ${grade ? `<div class="absolute top-3 right-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold text-white" style="background:var(--primary)">${grade}</span></div>` : ''}
            </div>
            <div class="p-6">
              <h3 class="font-serif-heading text-xl mb-3">${name}</h3>
              <div class="flex flex-wrap gap-4 text-xs text-gray-500 mb-4">
                <span><i class="fa-solid fa-location-dot mr-1"></i>${origin}</span>
                <span><i class="fa-solid fa-mountain mr-1"></i>${item.altitude || ''}</span>
              </div>
              <div class="flex flex-wrap gap-1.5">
                ${(item.certifications || []).map(c => `<span class="px-2 py-0.5 bg-green-50 text-[var(--primary)] text-xs rounded-full border border-green-100">${c}</span>`).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function getCategoryName() {
      const names = { green: 'Green Tea', black: 'Black Tea', oolong: 'Oolong Tea', white: 'White Tea', yellow: 'Yellow Tea', dark: 'Dark Tea', flower: 'Scented Tea' };
      return names[CATEGORY_ID] || 'Tea';
    }
    function getCategoryNameCN() {
      const names = { green: '绿茶', black: '红茶', oolong: '乌龙茶', white: '白茶', yellow: '黄茶', dark: '黑茶', flower: '工艺花茶' };
      return names[CATEGORY_ID] || '茶叶';
    }
    function getCategoryDesc() {
      const descs = {
        green: 'Fresh and vibrant Chinese green teas sourced from premium high-altitude gardens.',
        black: 'Rich and full-bodied black teas with smooth, malty character.',
        oolong: 'Partially oxidized teas with complex floral and roasted notes.',
        white: 'Minimally processed white teas with delicate, sweet flavors.',
        yellow: 'Rare and exquisite yellow teas with mellow, refined character.',
        dark: 'Aged and fermented dark teas with deep, earthy complexity.',
        flower: 'Artfully scented and blooming teas with captivating aromas.'
      };
      return descs[CATEGORY_ID] || 'Premium Chinese teas for global markets.';
    }
    function getCategoryDescCN() {
      const descs = {
        green: '来自优质高海拔茶园的清新绿茶。',
        black: '浓郁醇厚的红茶，口感顺滑。',
        oolong: '半发酵茶，花果香浓郁，层次丰富。',
        white: '轻发酵白茶，口感清甜淡雅。',
        yellow: '稀有黄茶，醇和细腻。',
        dark: '陈化发酵黑茶，滋味醇厚深沉。',
        flower: '精致窨制花茶，香气怡人。'
      };
      return descs[CATEGORY_ID] || '面向全球市场的优质中国茶叶。';
    }

    function switchLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      initPage();
    }

    loadData();
  </script>
</body>
</html>

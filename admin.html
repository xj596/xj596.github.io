<script>
// ============================================================
// GLOBAL STATE
// ============================================================
let AUTH = { token: '', owner: '', repo: '', branch: 'main' };
let SERVER_DATA = null;
let CURRENT_SHA = '';
let CURRENT_TAB = 1;
let confirmResolve = null;
let PRODUCTS_DATA = null;
let PRODUCTS_SHA = '';
let PRODUCTS_LOADED = false;
let DATA_READONLY = false;      // true when loaded from relative data.json (GitHub unavailable)
let PRODUCTS_READONLY = false;  // true when loaded from relative products.json

// ============================================================
// UTF-8 SAFE GITHUB CONTENT DECODE
// GitHub stores file content as base64 of UTF-8 bytes. The raw
// atob()+JSON.parse() path mangles multi-byte (Chinese) text and is
// fragile on parse errors. Use TextDecoder to restore UTF-8 exactly.
// ============================================================
function decodeGitHubContent(content) {
  const clean = (content || '').replace(/\s/g, '');
  if (!clean) throw new Error('文件内容为空');
  const binary = atob(clean);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  const text = new TextDecoder('utf-8').decode(bytes);
  try {
    return JSON.parse(text);
  } catch (pe) {
    throw new Error('JSON 解析失败：' + pe.message + '（文件可能不是合法 JSON）');
  }
}
async function loadFromRelative(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

const TAB_NAMES = {
  1: ['图片管理', '管理首页横幅、产品与证书图片 URL'],
  2: ['联系信息', '管理邮箱、电话与地址'],
  4: ['社交链接', '管理社交媒体平台链接'],
  5: ['展会信息', '管理展会与贸易展条目'],
  6: ['证书资质', '管理公司资质证书（名称/描述/图片）'],
  7: ['宣传册PDF', '管理可下载 PDF 链接'],
  8: ['新闻摘要', '管理首页新闻轮播'],
  9: ['新闻详情', '管理新闻文章完整内容'],
  10: ['发展历程', '管理公司历史里程碑'],
  11: ['数据统计', '管理首页统计数据'],
  13: ['询盘设置', '管理询盘联系信息'],
  14: ['产品管理', '管理产品图片与认证标签']
};

// ============================================================
// LOCAL STORAGE
// ============================================================
function saveCredentials() {
  localStorage.setItem('xftea_token', AUTH.token);
  localStorage.setItem('xftea_owner', AUTH.owner);
  localStorage.setItem('xftea_repo', AUTH.repo);
  localStorage.setItem('xftea_branch', AUTH.branch);
}
function loadCredentials() {
  AUTH.token = localStorage.getItem('xftea_token') || '';
  AUTH.owner = localStorage.getItem('xftea_owner') || '';
  AUTH.repo = localStorage.getItem('xftea_repo') || '';
  AUTH.branch = localStorage.getItem('xftea_branch') || 'main';
  if (AUTH.token) {
    document.getElementById('login-token').value = AUTH.token;
    document.getElementById('login-owner').value = AUTH.owner;
    document.getElementById('login-repo').value = AUTH.repo;
    document.getElementById('login-branch').value = AUTH.branch;
  }
}
function clearCredentials() {
  localStorage.removeItem('xftea_token');
  localStorage.removeItem('xftea_owner');
  localStorage.removeItem('xftea_repo');
  localStorage.removeItem('xftea_branch');
}

// ============================================================
// TOAST NOTIFICATIONS
// ============================================================
function showToast(message, type = 'info') {
  const colors = {
    success: 'bg-green-50 border-green-400 text-green-800',
    error: 'bg-red-50 border-red-400 text-red-800',
    info: 'bg-blue-50 border-blue-400 text-blue-800',
    warning: 'bg-yellow-50 border-yellow-400 text-yellow-800'
  };
  const icons = {
    success: 'fa-check-circle',
    error: 'fa-exclamation-circle',
    info: 'fa-info-circle',
    warning: 'fa-exclamation-triangle'
  };
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${colors[type] || colors.info} border rounded-xl px-4 py-3 flex items-center gap-3 shadow-lg`;
  toast.innerHTML = `<i class="fas ${icons[type]}"></i><span class="text-sm">${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
}

// ============================================================
// CONFIRMATION DIALOG
// ============================================================
function showConfirm(message) {
  return new Promise((resolve) => {
    confirmResolve = resolve;
    document.getElementById('confirm-message').textContent = message || 'Are you sure you want to push changes to GitHub?';
    document.getElementById('confirm-dialog').classList.remove('hidden');
  });
}
function closeConfirm(result) {
  document.getElementById('confirm-dialog').classList.add('hidden');
  if (confirmResolve) { confirmResolve(result); confirmResolve = null; }
}

// ============================================================
// UTILITIES
// ============================================================
function setLoading(el, loading) {
  if (typeof el === 'string') el = document.getElementById(el);
  if (!el) return;
  if (loading) {
    el.disabled = true;
    el.setAttribute('data-orig', el.innerHTML);
    el.innerHTML = `<div class="spinner" style="width:18px;height:18px;display:inline-block;vertical-align:middle;margin-right:6px;"></div>Processing...`;
  } else {
    el.disabled = false;
    if (el.getAttribute('data-orig')) el.innerHTML = el.getAttribute('data-orig');
  }
}
function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function getImgPreview(url) {
  if (!url || !url.trim()) return '';
  return `<img src="${escHtml(url)}" class="preview-img mt-2" onerror="this.style.display='none'" alt="preview">`;
}
function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ============================================================
// 4-LANGUAGE INPUT HELPERS (Req 4)
// ============================================================
const LANGS = [['en','EN 英文'],['ru','RU 俄文'],['de','DE 德文'],['zh','ZH 中文']];
function langInput(id, label, obj, type) {
  const o = obj || {};
  let h = '<div class="lang-group" style="margin-bottom:12px;">'
        + '<label style="margin-bottom:6px;">' + label + '</label>'
        + '<div class="grid-4">';
  for (const [l, lab] of LANGS) {
    const v = (o[l] !== undefined ? o[l] : '');
    if (type === 'textarea') {
      h += '<textarea id="' + id + '_' + l + '" rows="3" placeholder="' + lab + '">' + escHtml(v) + '</textarea>';
    } else {
      h += '<input type="text" id="' + id + '_' + l + '" value="' + escHtml(v) + '" placeholder="' + lab + '">';
    }
  }
  h += '</div></div>';
  return h;
}
function collectLang(id) {
  return {
    en: (document.getElementById(id + '_en')?.value || '').trim(),
    ru: (document.getElementById(id + '_ru')?.value || '').trim(),
    de: (document.getElementById(id + '_de')?.value || '').trim(),
    zh: (document.getElementById(id + '_zh')?.value || '').trim()
  };
}

// ============================================================
// GITHUB API
// ============================================================
async function githubApi(path, method = 'GET', body = null) {
  const base = 'https://api.github.com';
  const opts = {
    method,
    headers: {
      'Authorization': `Bearer ${AUTH.token}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }
  };
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(`${base}${path}`, opts);
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { const e = await res.json(); msg = e.message || msg; } catch(e) {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json();
}

// ============================================================
// AUTH
// ============================================================
async function handleLogin() {
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  AUTH.token = document.getElementById('login-token').value.trim();
  AUTH.owner = document.getElementById('login-owner').value.trim();
  AUTH.repo = document.getElementById('login-repo').value.trim();
  AUTH.branch = document.getElementById('login-branch').value.trim() || 'main';
  if (!AUTH.token || !AUTH.owner || !AUTH.repo) {
    errEl.textContent = '请填写所有必填项。';
    errEl.classList.remove('hidden');
    return;
  }
  setLoading(btn, true);
  try {
    // Verify the token (optional). Some tokens (fine-grained, contents-only)
    // cannot call /user yet can still read repo contents — so a /user failure
    // must NOT block loading data.
    try {
      const user = await githubApi('/user');
      document.getElementById('sidebar-user').textContent = user.login;
    } catch (ue) {
      document.getElementById('sidebar-user').textContent = AUTH.owner;
    }
    saveCredentials();
    document.getElementById('sidebar-repo').textContent = `${AUTH.owner}/${AUTH.repo} (${AUTH.branch})`;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('main-app').classList.remove('hidden');
    await loadDataJson();
    if (DATA_READONLY) {
      showToast('已连接，但 GitHub 读取受限，当前以站点本地 data.json 只读加载。', 'warning');
    } else {
      showToast('已连接 GitHub：' + (document.getElementById('sidebar-user').textContent || AUTH.owner), 'success');
    }
  } catch (e) {
    errEl.textContent = '加载失败：' + e.message;
    errEl.classList.remove('hidden');
  } finally {
    setLoading(btn, false);
  }
}

// ============================================================
// LOAD DATA FROM GITHUB
// ============================================================
async function loadDataJson() {
  const saveBtn = document.getElementById('save-btn');
  if (saveBtn) saveBtn.disabled = true;
  try {
    const res = await githubApi(`/repos/${AUTH.owner}/${AUTH.repo}/contents/data.json?ref=${encodeURIComponent(AUTH.branch)}`);
    CURRENT_SHA = res.sha;
    SERVER_DATA = decodeGitHubContent(res.content);
    DATA_READONLY = false;
    showToast('data.json 已从 GitHub 加载成功', 'success');
    switchTab(CURRENT_TAB);
    if (saveBtn) saveBtn.disabled = false;
  } catch (e) {
    // Fallback: read data.json from the same host (e.g. 阿里云虚拟主机).
    // This lets the admin display content even when GitHub is unreachable,
    // but saving back is disabled (read-only).
    try {
      SERVER_DATA = await loadFromRelative('data.json');
      CURRENT_SHA = '';
      DATA_READONLY = true;
      showToast('GitHub 读取失败（' + e.message + '），已改用站点本地 data.json 只读加载。', 'warning');
      switchTab(CURRENT_TAB);
      if (saveBtn) { saveBtn.disabled = true; saveBtn.title = '当前为只读模式：GitHub 不可用，无法保存'; }
      return;
    } catch (e2) { /* ignore, report original error below */ }
    showToast('data.json 加载失败：' + e.message, 'error');
  }
}

async function reloadData() {
  if (CURRENT_TAB === 14) {
    showToast('正在从 GitHub 重新加载产品...', 'info');
    PRODUCTS_LOADED = false;
    await loadProductsJson();
  } else {
    showToast('正在从 GitHub 重新加载数据...', 'info');
    await loadDataJson();
  }
}

// ============================================================
// SAVE TO GITHUB
// ============================================================
async function saveCurrentTab() {
  if (CURRENT_TAB === 14) {
    await saveProductsJson();
    return;
  }
  if (DATA_READONLY) {
    showToast('当前为只读模式：GitHub 连接失败，无法保存。请检查 Token / 仓库 / 分支后点击「刷新」。', 'error');
    return;
  }
  if (!SERVER_DATA || !CURRENT_SHA) {
    showToast('尚未加载数据，请先刷新。', 'error');
    return;
  }
  const confirmed = await showConfirm('确定要推送到 GitHub 的 data.json 吗？这将更新线上站点内容。');
  if (!confirmed) return;
  const saveBtn = document.getElementById('save-btn');
  setLoading(saveBtn, true);
  try {
    // Read form data for current tab and update SERVER_DATA
    getTabFormData(CURRENT_TAB);
    const jsonStr = JSON.stringify(SERVER_DATA, null, 2);
    const base64Content = toBase64(jsonStr);
    const body = {
      message: 'Update site content via admin panel',
      content: base64Content,
      sha: CURRENT_SHA,
      branch: AUTH.branch
    };
    const res = await githubApi(`/repos/${AUTH.owner}/${AUTH.repo}/contents/data.json`, 'PUT', body);
    CURRENT_SHA = res.content.sha;
    showToast('已成功推送到 GitHub！', 'success');
  } catch (e) {
    showToast('保存失败：' + e.message, 'error');
  } finally {
    setLoading(saveBtn, false);
  }
}

// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(num) {
  CURRENT_TAB = num;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const targetBtn = document.querySelector(`.tab-btn[data-tab="${num}"]`);
  if (targetBtn) targetBtn.classList.add('active');
  const info = TAB_NAMES[num] || ['', ''];
  document.getElementById('tab-title').textContent = info[0];
  document.getElementById('tab-desc').textContent = info[1];
  const footerNote = document.getElementById('footer-data-note');
  if (num === 14) {
    if (footerNote) footerNote.textContent = 'Data source: GitHub API - products.json (separate from data.json)';
    if (!PRODUCTS_LOADED) {
      loadProductsJson();
    }
  } else {
    if (footerNote) footerNote.textContent = '数据来源：GitHub API - data.json';
  }
  renderTab(num);
}

// ============================================================
// TAB RENDERERS
// ============================================================
function renderTab(num) {
  const content = document.getElementById('tab-content');
  if (num !== 14 && !SERVER_DATA) { content.innerHTML = '<div class="empty-state"><i class="fas fa-cloud-download-alt"></i><p class="text-lg font-medium">No data loaded</p><p class="text-sm">Please refresh to load data from GitHub.</p></div>'; return; }
  switch(num) {
    case 1: content.innerHTML = renderTabImages(); break;
    case 2: content.innerHTML = renderTabContact(); break;
    case 4: content.innerHTML = renderTabSocial(); break;
    case 5: content.innerHTML = renderTabExhibitions(); break;
    case 6: content.innerHTML = renderTabCertificates(); break;
    case 7: content.innerHTML = renderTabBrochure(); break;
    case 8: content.innerHTML = renderTabNewsSummary(); break;
    case 9: content.innerHTML = renderTabNewsDetail(); break;
    case 10: content.innerHTML = renderTabTimeline(); break;
    case 11: content.innerHTML = renderTabStats(); break;
    case 13: content.innerHTML = renderTabInquiry(); break;
    case 14: content.innerHTML = renderTabProducts(); break;
  }
}

function getTabFormData(num) {
  if (num !== 14 && !SERVER_DATA) return;
  switch(num) {
    case 1: getTabImagesData(); break;
    case 2: getTabContactData(); break;
    case 4: getTabSocialData(); break;
    case 5: getTabExhibitionsData(); break;
    case 6: collectCertificates(); break;
    case 7: getTabBrochureData(); break;
    case 8: getTabNewsSummaryData(); break;
    case 9: getTabNewsDetailData(); break;
    case 10: getTabTimelineData(); break;
    case 11: getTabStatsData(); break;
    case 13: getTabInquiryData(); break;
    case 14: getTabProductsData(); break;
  }
}

async function loadProductsJson() {
  const saveBtn = document.getElementById('save-btn');
  if (saveBtn) saveBtn.disabled = true;
  try {
    const res = await githubApi(`/repos/${AUTH.owner}/${AUTH.repo}/contents/products.json?ref=${encodeURIComponent(AUTH.branch)}`);
    PRODUCTS_SHA = res.sha;
    PRODUCTS_DATA = decodeGitHubContent(res.content);
    PRODUCTS_LOADED = true;
    PRODUCTS_READONLY = false;
    showToast('products.json 已从 GitHub 加载成功', 'success');
    renderTab(14);
    if (saveBtn) saveBtn.disabled = false;
  } catch (e) {
    // Fallback: relative products.json (read-only)
    try {
      PRODUCTS_DATA = await loadFromRelative('products.json');
      PRODUCTS_SHA = '';
      PRODUCTS_LOADED = true;
      PRODUCTS_READONLY = true;
      showToast('GitHub 读取失败（' + e.message + '），已改用站点本地 products.json 只读加载。', 'warning');
      renderTab(14);
      if (saveBtn) { saveBtn.disabled = true; saveBtn.title = '当前为只读模式：GitHub 不可用，无法保存'; }
      return;
    } catch (e2) { /* ignore */ }
    if (e.message && e.message.indexOf('404') !== -1) {
      PRODUCTS_DATA = { products: [] };
      PRODUCTS_SHA = '';
      PRODUCTS_LOADED = true;
      PRODUCTS_READONLY = false;
      showToast('未找到 products.json，保存时将创建新文件。', 'warning');
      renderTab(14);
      if (saveBtn) saveBtn.disabled = false;
    } else {
      showToast('products.json 加载失败：' + e.message, 'error');
    }
  }
}

async function saveProductsJson() {
  if (PRODUCTS_READONLY) {
    showToast('当前为只读模式：GitHub 连接失败，无法保存产品。请检查 Token / 仓库 / 分支后刷新。', 'error');
    return;
  }
  if (!PRODUCTS_DATA) {
    showToast('尚未加载产品数据，请先刷新。', 'error');
    return;
  }
  const confirmed = await showConfirm('确定要推送到 GitHub 的 products.json 吗？这将更新产品数据（独立于 data.json）。');
  if (!confirmed) return;
  const saveBtn = document.getElementById('save-btn');
  setLoading(saveBtn, true);
  try {
    getTabProductsData();
    const jsonStr = JSON.stringify(PRODUCTS_DATA, null, 2);
    const base64Content = toBase64(jsonStr);
    const body = {
      message: 'Update products via admin panel',
      content: base64Content,
      branch: AUTH.branch
    };
    if (PRODUCTS_SHA) body.sha = PRODUCTS_SHA;
    const res = await githubApi(`/repos/${AUTH.owner}/${AUTH.repo}/contents/products.json`, 'PUT', body);
    PRODUCTS_SHA = res.content.sha;
    showToast('已成功推送 products.json 到 GitHub！', 'success');
  } catch (e) {
    showToast('保存失败：' + e.message, 'error');
  } finally {
    setLoading(saveBtn, false);
  }
}

  return h;
}

function toggleCertTag(idx, key) {
  const btn = document.getElementById(`prod_cert_${idx}_${key}`);
  if (!btn) return;
  const active = btn.getAttribute('data-active') === 'true';
  const label = btn.getAttribute('data-label') || '';
  if (active) {
    btn.setAttribute('data-active', 'false');
    btn.className = 'btn-sm btn-secondary';
    btn.innerHTML = escHtml(label);
  } else {
    btn.setAttribute('data-active', 'true');
    btn.className = 'btn-sm btn-primary';
    btn.innerHTML = '<i class="fas fa-check mr-1"></i>' + escHtml(label);
  }
}

function addProductItem() {
  if (!PRODUCTS_DATA) PRODUCTS_DATA = { products: [] };
  if (!PRODUCTS_DATA.products) PRODUCTS_DATA.products = [];
  const newIdx = PRODUCTS_DATA.products.length + 1;
  PRODUCTS_DATA.products.push({
    id: 'product-' + newIdx,
    name: { en: '', ru: '', de: '', zh: '' },
    category: 'products.catGreen',
    images: {
      conventional: { dry: '', liquor: '' },
      eu: { dry: '', liquor: '' },
      organic: { dry: '', liquor: '' }
    },
    has_liquor: true,
    certTags: [],
    description: { en: '', ru: '', de: '', zh: '' },
    standard: { en: '', ru: '', de: '', zh: '' },
    spec: { en: '', ru: '', de: '', zh: '' },
    origin: { en: '', ru: '', de: '', zh: '' },
    specs: { packaging:'', minOrder:'', certifications:'' }
  });
  renderTab(14);
}

function deleteProductItem(idx) {
  if (!PRODUCTS_DATA || !PRODUCTS_DATA.products) return;
  PRODUCTS_DATA.products.splice(idx, 1);
  renderTab(14);
}

function getTabProductsData() {
  if (!PRODUCTS_DATA) PRODUCTS_DATA = { products: [] };
  if (!PRODUCTS_DATA.products) PRODUCTS_DATA.products = [];
  const items = document.querySelectorAll('#prod-list .list-item');
  const standards = ['conventional','eu','organic'];
  const certKeys = ['conventional','eu','organic'];
  const result = [];
  items.forEach(el => {
    const idx = parseInt(el.getAttribute('data-pidx'));
    const nameObj = collectLang('prod_name_' + idx);
    const descObj = collectLang('prod_desc_' + idx);
    const standardVal = document.getElementById('prod_standard_' + idx)?.value || 'conventional';
    const specObj = collectLang('prod_spec_' + idx);
    const originObj = collectLang('prod_origin_' + idx);
    const images = {};
    standards.forEach(std => {
      images[std] = {
        dry: document.getElementById(`prod_img_${std}_dry_${idx}`)?.value || '',
        liquor: document.getElementById(`prod_img_${std}_liquor_${idx}`)?.value || ''
      };
    });
    const certTags = [standardVal];
    result.push({
      id: document.getElementById(`prod_id_${idx}`)?.value || ('product-' + (idx+1)),
      name: nameObj,
      category: document.getElementById(`prod_category_${idx}`)?.value || '',
      images: images,
      has_liquor: document.getElementById(`prod_hasliquor_${idx}`)?.checked !== false,
      certTags: certTags,
      description: descObj,
      standard: standardVal,
      spec: specObj,
      origin: originObj,
      specs: {
        packaging: document.getElementById(`prod_pack_${idx}`)?.value || '',
        minOrder: document.getElementById(`prod_minorder_${idx}`)?.value || '',
        certifications: document.getElementById(`prod_certs_${idx}`)?.value || ''
      }
    });
  });
  PRODUCTS_DATA.products = result;
}

    if (!document.getElementById('confirm-dialog').classList.contains('hidden')) {
      closeConfirm(false);
    }
  }
});

function init() {
  loadCredentials();
  if (AUTH.token && AUTH.owner && AUTH.repo) {
    // Auto-login attempt
    handleLogin();
  }
  // Close confirm dialog on overlay click
  document.getElementById('confirm-dialog').addEventListener('click', function(e) {
    if (e.target === this) closeConfirm(false);

}

init();
